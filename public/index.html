<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题练习站</title>
<script>(function(n,d){if((n.deviceMemory||8)<4||(n.hardwareConcurrency||8)<4||matchMedia("(prefers-reduced-transparency: reduce)").matches)d.classList.add("lite")})(navigator,document.documentElement)</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#f4efe6">
</head><body><main>
<h1>错题练习站</h1>
<p class="sub" id="date"></p>

<a id="today" class="btn primary" href="/quiz" style="text-decoration:none">今日练习</a>
<div id="ask" style="margin-bottom:14px"></div>

<div class="card">
  <h2>最近推送的题</h2>
  <div id="recent" class="mute">还没有题</div>
</div>

<h2>按科目练</h2>
<div id="subjects" class="subjects"></div>
<div style="margin-bottom:14px">
  <label class="btn" for="pick">📷 拍照上传错题</label>
  <input id="pick" type="file" accept="image/*" multiple hidden>
  <p id="upmsg" class="mute" style="margin:8px 0 0"></p>
</div>

<div class="card" id="sumcard">
  <h2>Claude 的总结</h2>
  <div id="summary" class="mute" style="white-space:pre-wrap">还没有总结</div>
</div>

</main>
<script src="/common.js"></script>
<script src="/home.js"></script>
</body></html>
