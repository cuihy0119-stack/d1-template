<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题练习站</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head><body><main>
<h1>错题练习站</h1>

<div class="card">
  <label class="btn primary" for="pick">📷 拍照上传</label>
  <input id="pick" type="file" accept="image/*" multiple hidden>
  <p id="upmsg" class="mute" style="margin:8px 0 0"></p>
</div>

<a id="today" class="btn primary" href="/quiz" style="text-decoration:none;margin-bottom:14px">今日练习</a>

<div class="card" id="sumcard">
  <h2>Claude 的总结</h2>
  <div id="summary" class="mute">还没有总结</div>
</div>

<button id="wrongbtn" class="btn">错题库</button>
<div id="wrong" class="card hide" style="margin-top:14px">
  <div id="chips" class="chips"></div>
  <button id="redoall" class="btn small primary">全部重做</button>
  <div id="list"></div>
</div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="/common.js"></script>
<script src="/home.js"></script>
</body></html>
